<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.68);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(124, 58, 237, 0.25), transparent 60%),
        radial-gradient(800px 500px at 95% 15%, rgba(34, 211, 238, 0.18), transparent 55%),
        linear-gradient(180deg, #070a14, var(--bg));
    }

    header {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 10px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }

    .langToggle {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
      font-weight: 700;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    a.card {
      display: block;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: transform 0.08s ease, border-color 0.2s ease;
    }

    a.card:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.24);
    }

    .titleRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1 data-i18n="index.title">Dashboard</h1>
        <p data-i18n="index.subtitle">Demo pages and tools in this project.</p>
      </div>
      <button class="langToggle" type="button" data-lang-toggle>VI</button>
    </div>
  </header>

  <main>
    <a class="card" href="./ascii-tool.html">
      <div class="titleRow">
        <strong>Image → ASCII Art</strong>
        <span class="muted" data-i18n="index.ascii.description">Convert images to ASCII</span>
      </div>
    </a>

    <a class="card" href="./cherry-blossom.html">
      <div class="titleRow">
        <strong>Cherry Blossom</strong>
        <span class="muted" data-i18n="index.cherry.description">Falling cherry blossoms</span>
      </div>
    </a>

    <a class="card" href="./cyberpunk.html">
      <div class="titleRow">
        <strong>Cyberpunk</strong>
        <span class="muted" data-i18n="index.cyberpunk.description">Neon / glitch / particles</span>
      </div>
    </a>

    <a class="card" href="./block-puzzle-zen/">
      <div class="titleRow">
        <strong>Block Puzzle Zen</strong>
        <span class="muted" data-i18n="index.block.description">Vite + React app</span>
      </div>
    </a>
  </main>
  <script src="./i18n.js"></script>
</body>
</html>
