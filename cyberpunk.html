<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cyber.title">Cyberpunk City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            height: 100vh;
            position: relative;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #0a0015 0%, #1a0033 50%, #0d001a 100%);
        }

        /* Grid background */
        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            perspective: 1000px;
            transform: rotateX(60deg);
            transform-origin: center bottom;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 50px;
            }
        }

        /* Buildings */
        .building {
            position: absolute;
            bottom: 0;
            background: linear-gradient(180deg, #1a0033 0%, #0a0015 100%);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 
                inset 0 0 20px rgba(255, 0, 255, 0.2),
                0 0 30px rgba(0, 255, 255, 0.3);
        }

        .building::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 15px,
                    rgba(0, 255, 255, 0.1) 15px,
                    rgba(0, 255, 255, 0.1) 17px
                );
        }

        .building1 {
            left: 5%;
            width: 80px;
            height: 400px;
            animation: neonPulse1 3s ease-in-out infinite;
        }

        .building2 {
            left: 15%;
            width: 120px;
            height: 500px;
            animation: neonPulse2 4s ease-in-out infinite;
        }

        .building3 {
            right: 20%;
            width: 100px;
            height: 450px;
            animation: neonPulse1 3.5s ease-in-out infinite;
        }

        .building4 {
            right: 5%;
            width: 90px;
            height: 380px;
            animation: neonPulse2 4.5s ease-in-out infinite;
        }

        @keyframes neonPulse1 {
            0%, 100% {
                box-shadow: 
                    inset 0 0 20px rgba(255, 0, 255, 0.2),
                    0 0 30px rgba(0, 255, 255, 0.3);
            }
            50% {
                box-shadow: 
                    inset 0 0 30px rgba(255, 0, 255, 0.4),
                    0 0 50px rgba(0, 255, 255, 0.5);
            }
        }

        @keyframes neonPulse2 {
            0%, 100% {
                box-shadow: 
                    inset 0 0 20px rgba(0, 255, 255, 0.2),
                    0 0 30px rgba(255, 0, 255, 0.3);
            }
            50% {
                box-shadow: 
                    inset 0 0 30px rgba(0, 255, 255, 0.4),
                    0 0 50px rgba(255, 0, 255, 0.5);
            }
        }

        /* Title */
        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        .title h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 0.75rem;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: neonGlow 3s ease-in-out infinite, fadeIn 2s ease-in;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 0.5),
                0 0 20px rgba(255, 0, 255, 0.5);
            font-weight: bold;
            letter-spacing: 8px;
        }

        .title p {
            font-size: clamp(0.9rem, 2vw, 1.5rem);
            color: #00ffff;
            animation: fadeIn 3s ease-in, flicker 4s infinite;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 0.8),
                0 0 20px rgba(0, 255, 255, 0.5);
            letter-spacing: 4px;
        }

        .lang-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 120;
            border: 1px solid rgba(0, 255, 255, 0.58);
            border-radius: 999px;
            padding: 8px 12px;
            color: #00ffff;
            background: rgba(0, 0, 0, 0.62);
            cursor: pointer;
            font: 700 12px/1 'Courier New', monospace;
            box-shadow:
                0 0 16px rgba(0, 255, 255, 0.28),
                inset 0 0 12px rgba(255, 0, 255, 0.12);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.85);
        }

        .speed-tool {
            position: absolute;
            top: 60%;
            left: 50%;
            z-index: 20;
            width: min(520px, calc(100vw - 32px));
            padding: 22px;
            color: #eaffff;
            background:
                linear-gradient(135deg, rgba(0, 255, 255, 0.12), transparent 42%),
                linear-gradient(315deg, rgba(255, 0, 255, 0.16), transparent 48%),
                rgba(3, 0, 18, 0.82);
            border: 1px solid rgba(0, 255, 255, 0.85);
            border-radius: 6px;
            box-shadow:
                0 0 28px rgba(0, 255, 255, 0.36),
                0 0 58px rgba(255, 0, 255, 0.2),
                inset 0 0 24px rgba(0, 255, 255, 0.12);
            transform: translate(-50%, -50%);
            backdrop-filter: blur(8px);
        }

        .speed-tool::before,
        .speed-tool::after {
            content: "";
            position: absolute;
            width: 38px;
            height: 38px;
            pointer-events: none;
        }

        .speed-tool::before {
            top: -1px;
            left: -1px;
            border-top: 3px solid #ff00ff;
            border-left: 3px solid #ff00ff;
            box-shadow: -4px -4px 18px rgba(255, 0, 255, 0.5);
        }

        .speed-tool::after {
            right: -1px;
            bottom: -1px;
            border-right: 3px solid #00ffff;
            border-bottom: 3px solid #00ffff;
            box-shadow: 4px 4px 18px rgba(0, 255, 255, 0.5);
        }

        .speed-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        .speed-head h2 {
            margin: 0;
            color: #00ffff;
            font-size: clamp(1.1rem, 3vw, 1.45rem);
            letter-spacing: 2px;
            text-shadow:
                0 0 10px rgba(0, 255, 255, 0.9),
                0 0 24px rgba(255, 0, 255, 0.45);
        }

        .speed-status {
            min-width: 92px;
            color: #00ff66;
            font-size: 0.78rem;
            text-align: right;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
        }

        .speed-readout {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
        }

        .wifi-gauge {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 250px;
            padding: 14px 12px 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 255, 0.55);
            background:
                radial-gradient(circle at 50% 66%, rgba(0, 255, 255, 0.18), transparent 18%),
                radial-gradient(circle at 50% 78%, rgba(255, 0, 255, 0.14), transparent 34%),
                rgba(0, 0, 0, 0.38);
            box-shadow:
                inset 0 0 24px rgba(255, 0, 255, 0.1),
                0 0 20px rgba(255, 0, 255, 0.13);
        }

        .gauge-face {
            position: relative;
            width: min(360px, 100%);
            aspect-ratio: 2 / 1.12;
        }

        .gauge-arc {
            position: absolute;
            inset: 0 0 auto;
            aspect-ratio: 2 / 1;
            border-radius: 999px 999px 0 0;
            background:
                conic-gradient(from 270deg at 50% 100%,
                    #00ffff 0deg var(--gauge-angle, 0deg),
                    rgba(0, 255, 255, 0.12) var(--gauge-angle, 0deg) 180deg,
                    transparent 180deg 360deg);
            filter: drop-shadow(0 0 16px rgba(0, 255, 255, 0.5));
        }

        .gauge-arc::before {
            content: "";
            position: absolute;
            inset: 14px 14px 0;
            border-radius: inherit;
            background:
                repeating-conic-gradient(from 270deg at 50% 100%,
                    rgba(234, 255, 255, 0.9) 0 1.2deg,
                    transparent 1.2deg 9deg),
                linear-gradient(180deg, rgba(3, 0, 18, 0.96), rgba(0, 0, 0, 0.92));
        }

        .gauge-arc::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -1px;
            width: 74%;
            height: 74%;
            border-radius: 50% 50% 0 0;
            transform: translateX(-50%);
            background: rgba(3, 0, 18, 0.98);
            box-shadow: inset 0 0 28px rgba(0, 255, 255, 0.08);
        }

        .gauge-needle {
            position: absolute;
            left: 50%;
            bottom: 16px;
            z-index: 2;
            width: 42%;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent 0 8%, #eaffff 12%, #00ffff 64%, #ff00ff);
            box-shadow:
                0 0 12px rgba(0, 255, 255, 0.9),
                0 0 22px rgba(255, 0, 255, 0.55);
            transform: rotate(calc(-90deg + var(--gauge-angle, 0deg)));
            transform-origin: 0 50%;
            transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .gauge-hub {
            position: absolute;
            left: 50%;
            bottom: 2px;
            z-index: 3;
            width: 34px;
            height: 34px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            background: #060018;
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.85),
                inset 0 0 12px rgba(255, 0, 255, 0.45);
            transform: translateX(-50%);
        }

        .gauge-center {
            position: absolute;
            left: 50%;
            bottom: 30px;
            z-index: 4;
            width: 100%;
            text-align: center;
            transform: translateX(-50%);
        }

        .wifi-icon {
            position: relative;
            width: 58px;
            height: 34px;
            margin: 0 auto 8px;
        }

        .wifi-icon span {
            position: absolute;
            left: 50%;
            bottom: 0;
            border: 2px solid #00ffff;
            border-bottom: 0;
            border-radius: 90px 90px 0 0;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.85);
            transform: translateX(-50%);
        }

        .wifi-icon span:nth-child(1) {
            width: 54px;
            height: 28px;
            opacity: 0.42;
        }

        .wifi-icon span:nth-child(2) {
            width: 38px;
            height: 20px;
            opacity: 0.68;
        }

        .wifi-icon span:nth-child(3) {
            width: 20px;
            height: 11px;
            opacity: 0.95;
        }

        .wifi-icon::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff00ff;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.9);
            transform: translateX(-50%);
        }

        .gauge-value {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 8px;
            color: #ffffff;
            text-shadow: 0 0 16px rgba(0, 255, 255, 0.75);
        }

        .gauge-scale {
            position: absolute;
            left: 5px;
            right: 5px;
            bottom: 2px;
            display: flex;
            justify-content: space-between;
            color: rgba(234, 255, 255, 0.5);
            font-size: 0.66rem;
            letter-spacing: 1px;
        }

        .secondary-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .speed-metric {
            min-height: 88px;
            padding: 12px;
            border: 1px solid rgba(0, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.38);
            box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.08);
        }

        .speed-metric.primary {
            min-height: 250px;
            border-color: rgba(255, 0, 255, 0.55);
            box-shadow:
                inset 0 0 24px rgba(255, 0, 255, 0.1),
                0 0 20px rgba(255, 0, 255, 0.13);
        }

        .metric-label {
            display: block;
            margin-bottom: 8px;
            color: rgba(234, 255, 255, 0.68);
            font-size: 0.75rem;
            letter-spacing: 1.5px;
        }

        .metric-value {
            display: flex;
            align-items: baseline;
            gap: 8px;
            color: #ffffff;
            text-shadow: 0 0 16px rgba(0, 255, 255, 0.75);
        }

        .metric-number {
            font-size: clamp(2.25rem, 8vw, 4.4rem);
            line-height: 0.95;
            font-weight: 700;
        }

        .speed-metric:not(.primary) .metric-number {
            font-size: clamp(1.55rem, 4vw, 2.25rem);
        }

        .metric-unit {
            color: #00ffff;
            font-size: 0.86rem;
        }

        .speed-bar {
            position: relative;
            height: 9px;
            margin: 4px 0 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.55);
            background: rgba(0, 0, 0, 0.55);
        }

        .speed-bar span {
            display: block;
            width: var(--progress, 0%);
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.75);
            transition: width 0.2s ease;
        }

        .speed-note {
            color: rgba(234, 255, 255, 0.66);
            font-size: 0.78rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        @keyframes neonGlow {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            41% { opacity: 1; }
            42% { opacity: 0.8; }
            43% { opacity: 1; }
            45% { opacity: 0.9; }
            46% { opacity: 1; }
        }

        /* Glitch particles */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(var(--x-movement));
                opacity: 0;
            }
        }

        /* Glitch effect */
        .glitch {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff00ff, transparent);
            animation: glitchScan 8s linear infinite;
            opacity: 0.5;
        }

        @keyframes glitchScan {
            0% {
                top: 0;
            }
            100% {
                top: 100%;
            }
        }

        /* Neon circles */
        .neon-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid;
            animation: expandFade 4s ease-out infinite;
        }

        @keyframes expandFade {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* Stats panel */
        .stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00ffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ffff;
            font-size: 0.9rem;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .stats div {
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 255, 0.03) 2px,
                rgba(0, 255, 255, 0.03) 4px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* Hologram effect */
        .hologram {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 0, 255, 0.6);
            top: 20%;
            left: 30%;
            animation: rotate3d 10s linear infinite;
            transform-style: preserve-3d;
        }

        @keyframes rotate3d {
            0% {
                transform: rotateY(0deg) rotateX(0deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(360deg);
            }
        }

        @media (max-width: 640px) {
            .title {
                top: 8%;
            }

            .title h1 {
                letter-spacing: 3px;
            }

            .title p {
                letter-spacing: 2px;
            }

            .speed-tool {
                left: 50%;
                right: auto;
                top: 58%;
                width: calc(100vw - 24px);
                padding: 16px;
                transform: translate(-50%, -50%);
            }

            .speed-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .wifi-gauge {
                min-height: 220px;
                padding-top: 12px;
            }

            .gauge-face {
                width: min(260px, calc(100vw - 76px));
            }

            .secondary-metrics {
                grid-template-columns: 1fr;
            }

            .speed-metric {
                min-height: 72px;
            }

            .speed-status {
                text-align: left;
            }

        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Grid background -->
        <div class="grid"></div>

        <!-- Scanlines -->
        <div class="scanlines"></div>

        <!-- Glitch effect -->
        <div class="glitch"></div>

        <!-- Buildings -->
        <div class="building building1"></div>
        <div class="building building2"></div>
        <div class="building building3"></div>
        <div class="building building4"></div>

        <!-- Hologram -->
        <div class="hologram"></div>

        <!-- Title -->
        <div class="title">
            <h1>⚡ CYBERPUNK ⚡</h1>
            <p data-i18n="cyber.subtitle">WELCOME TO THE FUTURE</p>
        </div>

        <button class="lang-toggle" type="button" data-lang-toggle>VI</button>

        <!-- Speed test -->
        <section class="speed-tool" id="speedTool" aria-label="Internet speed meter">
            <div class="speed-head">
                <h2 data-i18n="cyber.meter.title">WIFI SPEED METER</h2>
                <div class="speed-status" id="speedStatus" data-i18n="cyber.status.ready">READY</div>
            </div>

            <div class="speed-readout">
                <div class="wifi-gauge" id="wifiGauge">
                    <div class="gauge-face">
                        <div class="gauge-arc"></div>
                        <div class="gauge-needle" id="gaugeNeedle"></div>
                        <div class="gauge-hub"></div>
                        <div class="gauge-center">
                            <div class="wifi-icon" aria-hidden="true">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span class="metric-label" data-i18n="cyber.metric.download">WIFI DOWNLOAD</span>
                            <div class="gauge-value">
                                <span class="metric-number" id="downloadSpeed">--</span>
                                <span class="metric-unit">Mbps</span>
                            </div>
                        </div>
                        <div class="gauge-scale" aria-hidden="true">
                            <span>0</span>
                            <span>100</span>
                            <span>250</span>
                            <span>500+</span>
                        </div>
                    </div>
                </div>

                <div class="secondary-metrics">
                    <div class="speed-metric">
                        <span class="metric-label" data-i18n="cyber.metric.upload">UPLOAD</span>
                        <div class="metric-value">
                            <span class="metric-number" id="uploadSpeed">--</span>
                            <span class="metric-unit">Mbps</span>
                        </div>
                    </div>

                    <div class="speed-metric">
                        <span class="metric-label" data-i18n="cyber.metric.ping">PING</span>
                        <div class="metric-value">
                            <span class="metric-number" id="pingValue">--</span>
                            <span class="metric-unit">ms</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="speed-bar" aria-hidden="true">
                <span id="speedProgress"></span>
            </div>

            <div class="speed-note" id="speedNote" data-i18n="cyber.note.initial">Automatically scans network speed when the page opens.</div>
        </section>

        <!-- Stats -->
        <div class="stats">
            <div><span data-i18n="cyber.stats.particles">PARTICLES:</span> <span id="particleCount">0</span></div>
            <div><span data-i18n="cyber.stats.system">SYSTEM STATUS:</span> <span style="color: #00ff00;" data-i18n="cyber.stats.online">ONLINE</span></div>
            <div data-i18n="cyber.stats.click">CLICK TO GENERATE EFFECTS</div>
        </div>
    </div>

    <script src="./i18n.js"></script>
    <script>
        const container = document.getElementById('container');
        const particleCountElement = document.getElementById('particleCount');
        const speedTool = document.getElementById('speedTool');
        const speedStatus = document.getElementById('speedStatus');
        const speedNote = document.getElementById('speedNote');
        const wifiGauge = document.getElementById('wifiGauge');
        const speedProgress = document.getElementById('speedProgress');
        const downloadSpeedElement = document.getElementById('downloadSpeed');
        const uploadSpeedElement = document.getElementById('uploadSpeed');
        const pingValueElement = document.getElementById('pingValue');
        let particleCount = 0;
        let testingSpeed = false;

        function t(key, fallback, params = {}) {
            const template = window.SakuraI18n ? window.SakuraI18n.t(key, fallback) : fallback;
            return Object.keys(params).reduce((text, name) => {
                return text.replaceAll(`{${name}}`, params[name]);
            }, template);
        }

        function setSpeedStatus(key, fallback, color) {
            speedStatus.textContent = t(key, fallback);
            if (color) {
                speedStatus.style.color = color;
            }
        }

        // Function to create a particle
        function createParticle(x, y, color) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const startX = x !== undefined ? x : Math.random() * window.innerWidth;
            particle.style.left = startX + 'px';
            particle.style.top = (y !== undefined ? y : window.innerHeight) + 'px';
            
            // Random color (cyan or magenta)
            const particleColor = color || (Math.random() > 0.5 ? '#00ffff' : '#ff00ff');
            particle.style.background = particleColor;
            particle.style.boxShadow = `0 0 10px ${particleColor}`;
            
            // Random size
            const size = 2 + Math.random() * 3;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            // Random duration
            const duration = 3 + Math.random() * 4;
            particle.style.animationDuration = duration + 's';
            
            // Random horizontal movement
            const xMovement = -100 + Math.random() * 200;
            particle.style.setProperty('--x-movement', xMovement + 'px');
            
            container.appendChild(particle);
            particleCount++;
            particleCountElement.textContent = particleCount;
            
            setTimeout(() => {
                particle.remove();
                particleCount--;
                particleCountElement.textContent = particleCount;
            }, duration * 1000);
        }

        // Function to create neon circle effect
        function createNeonCircle(x, y) {
            const circle = document.createElement('div');
            circle.className = 'neon-circle';
            circle.style.left = (x - 0) + 'px';
            circle.style.top = (y - 0) + 'px';
            
            const color = Math.random() > 0.5 ? '#00ffff' : '#ff00ff';
            circle.style.borderColor = color;
            circle.style.boxShadow = `0 0 20px ${color}`;
            
            container.appendChild(circle);
            
            setTimeout(() => {
                circle.remove();
            }, 4000);
        }

        function setSpeedProgress(value) {
            speedProgress.style.setProperty('--progress', `${Math.max(0, Math.min(value, 100))}%`);
        }

        function setGaugeSpeed(mbps) {
            const maxSpeed = 500;
            const safeSpeed = Number.isFinite(mbps) ? Math.max(0, Math.min(mbps, maxSpeed)) : 0;
            const angle = (safeSpeed / maxSpeed) * 180;
            wifiGauge.style.setProperty('--gauge-angle', `${angle}deg`);
        }

        function formatSpeed(mbps) {
            if (!Number.isFinite(mbps)) {
                return '--';
            }
            return mbps >= 100 ? mbps.toFixed(0) : mbps.toFixed(1);
        }

        function createTimeoutSignal(ms) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), ms);
            return { controller, timeout };
        }

        async function measurePing() {
            const samples = [];

            for (let i = 0; i < 3; i++) {
                const { controller, timeout } = createTimeoutSignal(5000);
                const started = performance.now();
                await fetch(`https://www.google.com/generate_204?cyber=${Date.now()}-${i}`, {
                    mode: 'no-cors',
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeout);
                samples.push(performance.now() - started);
            }

            return Math.round(samples.reduce((sum, value) => sum + value, 0) / samples.length);
        }

        async function measureDownload() {
            const bytesToDownload = 12000000;
            const { controller, timeout } = createTimeoutSignal(14000);
            const started = performance.now();
            let received = 0;

            const response = await fetch(`https://speed.cloudflare.com/__down?bytes=${bytesToDownload}&cyber=${Date.now()}`, {
                cache: 'no-store',
                signal: controller.signal
            });

            if (!response.ok || !response.body) {
                throw new Error('Unable to download speed test data.');
            }

            const reader = response.body.getReader();

            while (true) {
                const { done, value } = await reader.read();

                if (done) {
                    break;
                }

                received += value.length;
                const elapsed = (performance.now() - started) / 1000;
                const liveMbps = elapsed > 0 ? (received * 8) / elapsed / 1000000 : 0;
                setGaugeSpeed(liveMbps);
                setSpeedProgress(25 + (received / bytesToDownload) * 45);

                if (elapsed > 4 && received > 1000000) {
                    controller.abort();
                    break;
                }
            }

            clearTimeout(timeout);
            const seconds = (performance.now() - started) / 1000;
            return (received * 8) / seconds / 1000000;
        }

        async function measureUpload() {
            const uploadBytes = 2500000;
            const payload = new Uint8Array(uploadBytes);
            const { controller, timeout } = createTimeoutSignal(12000);
            const started = performance.now();

            const response = await fetch(`https://speed.cloudflare.com/__up?bytes=${uploadBytes}&cyber=${Date.now()}`, {
                method: 'POST',
                body: payload,
                cache: 'no-store',
                signal: controller.signal
            });

            clearTimeout(timeout);

            if (!response.ok) {
                throw new Error('Unable to upload speed test data.');
            }

            const seconds = (performance.now() - started) / 1000;
            return (uploadBytes * 8) / seconds / 1000000;
        }

        async function runSpeedTest() {
            if (testingSpeed) {
                return;
            }

            testingSpeed = true;
            setSpeedStatus('cyber.status.testing', 'TESTING', '#ffff00');
            speedNote.textContent = t('cyber.note.ping', 'Measuring ping...');
            setSpeedProgress(8);
            setGaugeSpeed(0);
            downloadSpeedElement.textContent = '--';
            uploadSpeedElement.textContent = '--';
            pingValueElement.textContent = '--';

            try {
                const ping = await measurePing();
                pingValueElement.textContent = ping;
                setSpeedProgress(24);

                speedNote.textContent = t('cyber.note.download', 'Measuring download...');
                const download = await measureDownload();
                downloadSpeedElement.textContent = formatSpeed(download);
                setGaugeSpeed(download);
                setSpeedProgress(72);

                speedNote.textContent = t('cyber.note.upload', 'Measuring upload...');
                const upload = await measureUpload();
                uploadSpeedElement.textContent = formatSpeed(upload);
                setSpeedProgress(100);

                setSpeedStatus('cyber.status.done', 'DONE', '#00ff66');
                speedNote.textContent = t('cyber.note.done', 'Completed at {time}.', {
                    time: new Date().toLocaleTimeString(window.SakuraI18n && window.SakuraI18n.getLanguage() === 'vi' ? 'vi-VN' : 'en-US')
                });
            } catch (error) {
                setSpeedStatus('cyber.status.error', 'ERROR', '#ff3864');
                speedNote.textContent = error.name === 'AbortError'
                    ? t('cyber.note.timeout', 'The scan timed out. Try again when the network is more stable.')
                    : t('cyber.note.error', 'Unable to scan. Network, CORS, or an ad blocker may be blocking the endpoint.');
            } finally {
                testingSpeed = false;
            }
        }

        // Create particles periodically
        function startParticleFlow() {
            setInterval(() => {
                createParticle();
            }, 200);
        }

        // Handle click events
        container.addEventListener('click', (e) => {
            // Create particle burst
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    createParticle(
                        e.clientX + (Math.random() - 0.5) * 150,
                        e.clientY,
                        Math.random() > 0.5 ? '#00ffff' : '#ff00ff'
                    );
                }, i * 30);
            }
            
            // Create neon circle
            createNeonCircle(e.clientX, e.clientY);
        });

        speedTool.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Start particle flow
        startParticleFlow();
        window.setTimeout(runSpeedTest, 450);

        // Create initial particles
        for (let i = 0; i < 30; i++) {
            setTimeout(() => createParticle(), i * 100);
        }

        // Random glitch effects
        setInterval(() => {
            if (Math.random() > 0.7) {
                const glitch = document.createElement('div');
                glitch.className = 'glitch';
                glitch.style.top = Math.random() * 100 + '%';
                glitch.style.animationDuration = (0.5 + Math.random() * 1) + 's';
                container.appendChild(glitch);
                
                setTimeout(() => {
                    glitch.remove();
                }, 1500);
            }
        }, 2000);
    </script>
</body>
</html>
